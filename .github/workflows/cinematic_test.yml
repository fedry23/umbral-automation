name: UMBRAL - Render cinematografico episodio 6 sin publicar
on:
  push:
    branches: [main]
    paths: ['ops/cinematic-render.txt']
permissions:
  contents: read
concurrency:
  group: umbral-cinematic-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UMBRAL_TEST_MODE: cinematic-episode-6
      UMBRAL_STORY_TITLE: La luz del rellano
      UMBRAL_SPEED: '1.08'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar herramientas gratuitas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core libsndfile1
          python -m pip install -r requirements.txt PyYAML
      - name: Regresiones completas
        run: python -m unittest discover -s tests -v
      - name: Render original sin publicar
        run: python -u render.py
      - name: Guardar prueba para inspeccion previa
        uses: actions/upload-artifact@v4
        with:
          name: umbral-cinematic-6
          path: output/
          retention-days: 7
          if-no-files-found: error
