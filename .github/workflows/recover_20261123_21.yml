name: UMBRAL - Recuperación autorizada 23 Nov 21:00
on:
  push:
    branches: [main]
    paths: ['ops/recover-20261123-21.txt']
permissions:
  contents: write
  actions: read
  pages: write
jobs:
  prioritize:
    if: github.repository == 'fedry23/umbral-automation' && vars.UMBRAL_META_PUBLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    outputs:
      paused: ${{ steps.pause.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Safely release the morning wait, not an Instagram POST
        id: pause
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(TZ=Europe/Madrid date +%F)" = 2026-11-24
          if [[ "$(TZ=Europe/Madrid date +%H%M)" > "0810" ]]; then
            echo "::notice::Too close to 09:00 to interrupt morning preparation"
            exit 0
          fi
          test ! -e docs/published/2026-11-24_09.json
          test ! -e docs/pending/2026-11-24_09.json
          test ! -e docs/published/2026-11-23.json
          test ! -e docs/pending/2026-11-23.json
          morning=45318958600
          old_recovery=45337672516
          base="repos/$GITHUB_REPOSITORY/actions/runs"
          test "$(gh api "$base/$morning" --jq .path)" = ".github/workflows/umbral3_hf_storage.yml"
          test "$(gh api "$base/$morning" --jq .status)" = in_progress
          gh api "$base/$morning/jobs" --jq '.jobs[] | select(.id == 138192632025 and .status == "in_progress") | .steps[] | select(.name == "Publish only at the official civil slot after final Meta readback" and .status == "in_progress") | .name' | grep -Fx "Publish only at the official civil slot after final Meta readback"
          status="$(gh api "$base/$old_recovery" --jq .status)"
          if [[ "$status" == pending || "$status" == queued ]]; then
            gh api --method POST "$base/$old_recovery/cancel"
          elif [[ "$status" != completed ]]; then
            echo "::error::Existing recovery already running, do not interfere"
            exit 1
          fi
          # At least 49 minutes before 09:00, no durable Meta intent; the
          # running morning process is only waiting for its release hour.
          gh api --method POST "$base/$morning/cancel"
          echo "paused=true" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 36); do
            if [[ "$(gh api "$base/$morning" --jq .status)" == completed ]]; then exit 0; fi
            sleep 5
          done
          echo "::error::Morning cancellation not confirmed"
          exit 1
  publicar:
    needs: prioritize
    if: github.repository == 'fedry23/umbral-automation' && vars.UMBRAL_META_PUBLISH_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: umbral-instagram-official
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      UMBRAL_DURABLE_GUARD: '1'
      UMBRAL_DYNAMIC_EPISODES: '1'
      UMBRAL_SLOT: '21'
      UMBRAL_RECOVERY_DATE: '2026-11-23'
    steps:
      - name: Código y autorización
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main

      - name: Verify owner-authorized date and absence of a receipt
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(TZ=Europe/Madrid date +%F)" = "2026-11-24"
          echo "date=2026-11-23" >> "$GITHUB_OUTPUT"
          if [ -f docs/published/2026-11-23.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar Python
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffprobe
        if: steps.guard.outputs.skip == 'false'
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4

      - name: Comprobar credenciales sin mostrarlas
        if: steps.guard.outputs.skip == 'false'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::error::Falta GitHub Actions Secret IG_ACCESS_TOKEN; publicación no habilitada"
            exit 1
          fi

      - name: Reconciliar intentos pendientes (solo lectura Meta)
        if: steps.guard.outputs.skip == 'false'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/reconcile_publications.py

      - name: Recuperar y verificar Reel generado de madrugada
        id: stage
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        run: python scripts/stage_daily_reel.py

      - name: Verify exact pending story and current official episode number
        if: steps.stage.outcome == 'failure'
        run: python -c 'from scripts.episode_state import planned_episode; planned_episode("2026-11-23", "21")'
      - name: Restore render models only if the old episode number is stale
        if: steps.stage.outcome == 'failure'
        uses: ./.github/actions/setup-render
        with:
          models: 'true'
      - name: Regenerate the same dated story with current verified number
        if: steps.stage.outcome == 'failure'
        run: |
          rm -rf -- output staged
          python scripts/stage_daily_reel.py --local-render

      - name: Validar formato Meta y autocorregir audio si hace falta
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          DAY="${{ steps.guard.outputs.date }}"
          python scripts/ensure_meta_compatible.py "staged/umbral_${DAY//-/}.mp4"

      - name: Guardar la copia pública HTTPS de hoy
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          DAY="${{ steps.guard.outputs.date }}"
          if [ -f staged/already_published ]; then exit 0; fi
          mkdir -p docs/reels
          cp "staged/umbral_${DAY//-/}.mp4" "docs/reels/$DAY.mp4"
          test -f staged/cover.jpg
          cp staged/cover.jpg "docs/reels/$DAY.jpg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/reels/$DAY.mp4" "docs/reels/$DAY.jpg"
          if ! git diff --cached --quiet; then
            git commit -m "UMBRAL: preparar Reel original $DAY"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Solicitar explícitamente el despliegue de GitHub Pages
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          # Los pushes hechos por GITHUB_TOKEN no desencadenan Pages automáticamente.
          # API oficial: POST /repos/{owner}/{repo}/pages/builds (pages:write)
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo "Actualización de Pages solicitada para el vídeo del día"

      - name: Verificar que GitHub Pages sirve MP4 y portada JPEG exactos
        if: steps.guard.outputs.skip == 'false'
        env:
          UMBRAL_COVER_REQUIRED: '1'
          UMBRAL_VIDEO_FILE: docs/reels/2026-11-23.mp4
          UMBRAL_COVER_FILE: docs/reels/2026-11-23.jpg
          UMBRAL_VIDEO_URL: https://fedry23.github.io/umbral-automation/reels/2026-11-23.mp4
          UMBRAL_COVER_URL: https://fedry23.github.io/umbral-automation/reels/2026-11-23.jpg
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          python scripts/wait_public_video.py

      - name: Preparar el contenedor de Instagram con tiempo
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          test -s staged/public_cover_url.txt
          python scripts/publish_daily.py prepare \
            --date "${{ steps.guard.outputs.date }}" \
            --video-url "$(cat staged/public_video_url.txt)" \
            --cover-url "$(cat staged/public_cover_url.txt)"

      - name: Publicar exactamente a las 21:00 hora peninsular
        if: steps.guard.outputs.skip == 'false'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          python scripts/publish_daily.py publish --date "${{ steps.guard.outputs.date }}"

      - name: Registrar ID y fecha, evitando futuras publicaciones duplicadas
        if: always() && steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          DAY="${{ steps.guard.outputs.date }}"
          if [ ! -f staged/published.json ]; then exit 0; fi
          mkdir -p docs/published
          cp staged/published.json "docs/published/$DAY.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/published/$DAY.json"
          git commit -m "UMBRAL: publicación Instagram confirmada $DAY" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Conservar diagnostico y recibo incluso si falla la verificacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-publication-receipt
          path: |
            staged/published.json
            staged/prepared.json
            staged/instagram_cover.jpg
          if-no-files-found: ignore
      - name: Aviso visible de fallo
        if: failure()
        run: echo '::error::UMBRAL fallo. Revisar pasos y recibo; no repetir publicaciones inciertas.'

  restore-morning:
    needs: [prioritize, publicar]
    if: always() && needs.prioritize.outputs.paused == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Restart the exact morning workflow with fresh official numbering
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(TZ=Europe/Madrid date +%F)" = 2026-11-24
          base="repos/$GITHUB_REPOSITORY/actions/runs/45318958600"
          for i in $(seq 1 60); do
            if [[ "$(gh api "$base" --jq .status)" == completed ]]; then
              gh api --method POST "$base/rerun"
              echo "Morning official workflow restarted; it checks Meta and late-binds the next episode number."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Morning workflow did not reach a terminal state; restart not confirmed"
          exit 1
