name: UMBRAL - Comprobar token Meta sin publicar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meta_token_preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - name: Verificar token y cuenta sin revelar credenciales
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from urllib.parse import urlencode

          token = os.environ.get("IG_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("TOKEN_MISSING: IG_ACCESS_TOKEN no está disponible")
          account = "17841465578937909"
          target = "umbral.terror"
          def get(host, path, fields):
              url = "https://" + host + "/v25.0/" + path + "?" + urlencode({"fields": fields})
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      return json.load(resp), 200
              except urllib.error.HTTPError as exc:
                  return None, exc.code
              except Exception:
                  return None, 0
          results = []
          for host in ["graph.instagram.com", "graph.facebook.com"]:
              data, status = get(host, account, "id,username")
              if data and str(data.get("username","")).casefold() == target:
                  print("CONEXION_OK: host=" + host + " cuenta=@" + target)
                  print("IDENTIFICADOR_IG_VERIFICADO: " + str(data.get("id","")))
                  quota, quota_code = get(host, account + "/content_publishing_limit", "quota_usage")
                  if quota_code == 200 and quota is not None:
                      print("PERMISO_PUBLICACION_VERIFICADO: lectura de cuota permitida")
                      # Inspección de caducidad y scopes. Nunca imprimir token, URL ni respuesta completa.
                      from datetime import datetime, timezone
                      u = "https://graph.facebook.com/v25.0/debug_token?" + urlencode({"input_token": token})
                      req = urllib.request.Request(u, headers={"Authorization": "Bearer " + token})
                      try:
                          with urllib.request.urlopen(req, timeout=20) as response:
                              info = json.load(response).get("data", {})
                          expires = info.get("expires_at", 0)
                          kind = info.get("type", "desconocido")
                          perms = info.get("scopes", [])
                          if expires:
                              print("TOKEN_EXPIRA_UTC: " + datetime.fromtimestamp(expires, timezone.utc).isoformat())
                              if datetime.fromtimestamp(expires, timezone.utc).timestamp() < datetime.now(timezone.utc).timestamp() + 2 * 86400:
                                  print("ADVERTENCIA: token de corta duración; no sirve para la publicación diaria a largo plazo")
                          else:
                              print("TOKEN_EXPIRACION: sin vencimiento declarado")
                          print("TOKEN_TIPO: " + str(kind))
                          print("PUBLISH_SCOPE_PRESENTE: " + str("instagram_content_publish" in perms))
                          if "instagram_content_publish" not in perms:
                              raise SystemExit("PUBLICACION_NO_AUTORIZADA: Falta scope instagram_content_publish")
                          if expires and expires - datetime.now(timezone.utc).timestamp() < 10 * 86400:
                              raise SystemExit("TOKEN_DEMASIADO_CORTO: Ampliar token antes de activar cron")
                          print("TOKEN_VALIDO_PARA_AUTOMATIZACION: SÍ")
                      except urllib.error.HTTPError as e:
                          print("TOKEN_EXPIRACION_NO_CONSULTABLE: HTTP " + str(e.code))
                      except Exception:
                          print("TOKEN_EXPIRACION_NO_CONSULTABLE: error de lectura")
                      raise SystemExit(0)
                  print("PERMISO_PUBLICACION_NO_CONFIRMADO: código HTTP " + str(quota_code))
                  raise SystemExit(2)
              me, code = get(host, "me", "id,username")
              if me and str(me.get("username","")).casefold() == target:
                  print("CONEXION_OK: host=" + host + " cuenta=@" + target)
                  print("IDENTIFICADOR_IG_VERIFICADO: " + str(me.get("id","")))
                  quota, quota_code = get(host, str(me.get("id","")) + "/content_publishing_limit", "quota_usage")
                  if quota_code == 200 and quota is not None:
                      print("PERMISO_PUBLICACION_VERIFICADO: lectura de cuota permitida")
                      # Inspección de caducidad y scopes. Nunca imprimir token, URL ni respuesta completa.
                      from datetime import datetime, timezone
                      u = "https://graph.facebook.com/v25.0/debug_token?" + urlencode({"input_token": token})
                      req = urllib.request.Request(u, headers={"Authorization": "Bearer " + token})
                      try:
                          with urllib.request.urlopen(req, timeout=20) as response:
                              info = json.load(response).get("data", {})
                          expires = info.get("expires_at", 0)
                          kind = info.get("type", "desconocido")
                          perms = info.get("scopes", [])
                          if expires:
                              print("TOKEN_EXPIRA_UTC: " + datetime.fromtimestamp(expires, timezone.utc).isoformat())
                              if datetime.fromtimestamp(expires, timezone.utc).timestamp() < datetime.now(timezone.utc).timestamp() + 2 * 86400:
                                  print("ADVERTENCIA: token de corta duración; no sirve para la publicación diaria a largo plazo")
                          else:
                              print("TOKEN_EXPIRACION: sin vencimiento declarado")
                          print("TOKEN_TIPO: " + str(kind))
                          print("PUBLISH_SCOPE_PRESENTE: " + str("instagram_content_publish" in perms))
                          if "instagram_content_publish" not in perms:
                              raise SystemExit("PUBLICACION_NO_AUTORIZADA: Falta scope instagram_content_publish")
                          if expires and expires - datetime.now(timezone.utc).timestamp() < 10 * 86400:
                              raise SystemExit("TOKEN_DEMASIADO_CORTO: Ampliar token antes de activar cron")
                          print("TOKEN_VALIDO_PARA_AUTOMATIZACION: SÍ")
                      except urllib.error.HTTPError as e:
                          print("TOKEN_EXPIRACION_NO_CONSULTABLE: HTTP " + str(e.code))
                      except Exception:
                          print("TOKEN_EXPIRACION_NO_CONSULTABLE: error de lectura")
                      raise SystemExit(0)
                  print("PERMISO_PUBLICACION_NO_CONFIRMADO: código HTTP " + str(quota_code))
                  raise SystemExit(2)
              results.append(host + "=" + str(status) + ",me=" + str(code))
          print("NO_VALIDADO: Token presente, pero no se pudo comprobar acceso a @umbral.terror. Resultados: " + " ; ".join(results))
          raise SystemExit(1)
          PY
