name: UMBRAL - Comprobar token Meta sin publicar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meta_token_preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - name: Verificar token y cuenta sin revelar credenciales
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          from urllib.parse import urlencode

          token = os.environ.get("IG_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("TOKEN_MISSING: IG_ACCESS_TOKEN no está disponible")
          account = "17841465578937909"
          target = "umbral.terror"
          def get(host, path, fields):
              url = "https://" + host + "/v25.0/" + path + "?" + urlencode({"fields": fields})
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      return json.load(resp), 200
              except urllib.error.HTTPError as exc:
                  return None, exc.code
              except Exception:
                  return None, 0
          results = []
          for host in ["graph.instagram.com", "graph.facebook.com"]:
              data, status = get(host, account, "id,username")
              if data and str(data.get("username","")).casefold() == target:
                  print("CONEXION_OK: host=" + host + " cuenta=@" + target)
                  print("IDENTIFICADOR_IG_VERIFICADO: " + str(data.get("id","")))
                  quota, quota_code = get(host, account + "/content_publishing_limit", "quota_usage")
                  if quota_code == 200 and quota is not None:
                      print("PERMISO_PUBLICACION_VERIFICADO: lectura de cuota permitida")
                      raise SystemExit(0)
                  print("PERMISO_PUBLICACION_NO_CONFIRMADO: código HTTP " + str(quota_code))
                  raise SystemExit(2)
              me, code = get(host, "me", "id,username")
              if me and str(me.get("username","")).casefold() == target:
                  print("CONEXION_OK: host=" + host + " cuenta=@" + target)
                  print("IDENTIFICADOR_IG_VERIFICADO: " + str(me.get("id","")))
                  quota, quota_code = get(host, str(me.get("id","")) + "/content_publishing_limit", "quota_usage")
                  if quota_code == 200 and quota is not None:
                      print("PERMISO_PUBLICACION_VERIFICADO: lectura de cuota permitida")
                      raise SystemExit(0)
                  print("PERMISO_PUBLICACION_NO_CONFIRMADO: código HTTP " + str(quota_code))
                  raise SystemExit(2)
              results.append(host + "=" + str(status) + ",me=" + str(code))
          print("NO_VALIDADO: Token presente, pero no se pudo comprobar acceso a @umbral.terror. Resultados: " + " ; ".join(results))
          raise SystemExit(1)
          PY
