name: UMBRAL - Verificar montaje, caratulas y Meta

on:
  push:
    branches: [main, release/editorial-week-2026-11-21]
    paths:
      - 'render.py'
      - 'music_engine.py'
      - 'requirements*.txt'
      - '.github/actions/**'
      - 'stories.json'
      - 'stories_morning.json'
      - 'audio_engine.py'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/quality_gate.yml'
      - '.github/workflows/reel.yml'
      - '.github/workflows/publish_daily.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/umbral3_hf_storage.yml'
      - '.github/workflows/quality_gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umbral-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-render
        with:
          models: "false"
      - name: Comprobar sintaxis Python
        run: python -m compileall -q render.py audio_engine.py scripts tests
      - name: Ejecutar pruebas de vídeo, portadas, voces y duplicados
        run: python -m unittest discover -s tests -v
      - name: Verificar que este workflow jamás publica contenido
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          flow = yaml.load(Path('.github/workflows/quality_gate.yml').read_text(), Loader=yaml.BaseLoader)
          assert flow['permissions']['contents']=='read'
          assert set(flow['jobs']) == {'validar'}
          print('UMBRAL: quality gate de solo lectura, sin tokens Meta ni publicaciones')
          PY
