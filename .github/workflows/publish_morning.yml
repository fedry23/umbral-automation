name: UMBRAL - Publicación oficial a las 09:00

on:
  # Dos lanzamientos con margen, antes de las 21:00 Europe/Madrid.
  # La segunda llamada es respaldo: nunca publica si la primera ya lo hizo.
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 6 * * *'
  # Respaldo por push: activado por la tarea diaria externa; no publica fuera de hora.
  push:
    branches: [main]
    paths:
      - 'ops/publish-morning-kick.txt'
  workflow_dispatch:
  workflow_call:
  # Recover from a missed scheduler by reacting to a verified daily render.
  workflow_run:
    workflows: ['UMBRAL - Generación 09:00']
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  pages: write

concurrency:
  group: umbral-instagram-official
  cancel-in-progress: false

jobs:
  publicar:
    # Publicación programada autorizada. La tarea antigua de ChatGPT está desactivada.
    # Bloqueo manual de emergencia: UMBRAL_META_PUBLISH_ENABLED=false en Variables.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_call' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'push') && github.event.workflow_run.head_repository.full_name == github.repository)) && vars.UMBRAL_META_PUBLISH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      UMBRAL_DURABLE_GUARD: '1'
      UMBRAL_DYNAMIC_EPISODES: '1'
      UMBRAL_SLOT: '09'
    steps:
      - name: Código y autorización
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==1.26.4

      - name: Comprobar credenciales sin mostrarlas
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::error::Falta GitHub Actions Secret IG_ACCESS_TOKEN; publicación no habilitada"
            exit 1
          fi

      - name: Reconciliar intentos pendientes (solo lectura Meta)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/reconcile_publications.py

      - name: Comprobar día, hora y duplicados
        id: guard
        shell: bash
        run: |
          DAY="$(TZ=Europe/Madrid date +%F)"
          HHMM="$(TZ=Europe/Madrid date +%H%M)"
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          if [ -f "docs/published/${DAY}_09.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "UMBRAL ya tiene recibo para $DAY, no duplicar"
          elif [[ "$HHMM" < "0500" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Antes de las 17:00 Europe/Madrid; esperar a la ventana de publicación"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Generación comprobable y publicación preparada antes de las 21:00"
          fi

      - name: Recuperar y verificar Reel generado de madrugada
        id: stage
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        run: python scripts/stage_morning_reel.py

      - name: Verificar que es seguro regenerar
        if: steps.stage.outcome == 'failure'
        run: |
          python -c 'from scripts.episode_state import planned_episode; import os; planned_episode(os.environ["RECOVERY_DAY"], os.environ.get("UMBRAL_SLOT", "21"))'
        env:
          RECOVERY_DAY: ${{ steps.guard.outputs.date }}

      - name: Preparar modelos solo si el artefacto no es válido
        if: steps.stage.outcome == 'failure'
        uses: ./.github/actions/setup-render
        with:
          models: 'true'

      - name: Regenerar y validar con el número confirmado
        if: steps.stage.outcome == 'failure'
        env:
          UMBRAL_SPEED: '1.08'
        run: |
          rm -rf -- output staged
          python scripts/stage_morning_reel.py --local-render

      - name: Validar formato Meta y autocorregir audio si hace falta
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          DAY="${{ steps.guard.outputs.date }}"
          python scripts/ensure_meta_compatible.py "staged/umbral_${DAY//-/}_09.mp4"

      - name: Guardar la copia pública HTTPS de hoy
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          DAY="${{ steps.guard.outputs.date }}"
          if [ -f staged/already_published ]; then exit 0; fi
          mkdir -p docs/reels
          cp "staged/umbral_${DAY//-/}_09.mp4" "docs/reels/${DAY}_09.mp4"
          test -f staged/cover.jpg
          cp staged/cover.jpg "docs/reels/${DAY}_09.jpg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/reels/${DAY}_09.mp4" "docs/reels/${DAY}_09.jpg"
          if ! git diff --cached --quiet; then
            git commit -m "UMBRAL: preparar Reel original $DAY"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Solicitar explícitamente el despliegue de GitHub Pages
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          # Los pushes hechos por GITHUB_TOKEN no desencadenan Pages automáticamente.
          # API oficial: POST /repos/{owner}/{repo}/pages/builds (pages:write)
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo "Actualización de Pages solicitada para el vídeo del día"

      - name: Verificar que GitHub Pages sirve MP4 y portada JPEG exactos
        if: steps.guard.outputs.skip == 'false'
        env:
          UMBRAL_COVER_REQUIRED: '1'
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          python scripts/wait_public_video.py

      - name: Preparar el contenedor de Instagram con tiempo
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          test -s staged/public_cover_url.txt
          python scripts/publish_daily.py prepare \
            --date "${{ steps.guard.outputs.date }}" \
            --video-url "$(cat staged/public_video_url.txt)" \
            --cover-url "$(cat staged/public_cover_url.txt)"

      - name: Publicar a las 09:00 o tan pronto como sea posible
        if: steps.guard.outputs.skip == 'false'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          python scripts/publish_daily.py publish --date "${{ steps.guard.outputs.date }}"

      - name: Registrar ID y fecha, evitando futuras publicaciones duplicadas
        if: always() && steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          DAY="${{ steps.guard.outputs.date }}"
          if [ ! -f staged/published.json ]; then exit 0; fi
          mkdir -p docs/published
          cp staged/published.json "docs/published/${DAY}_09.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/published/${DAY}_09.json"
          git commit -m "UMBRAL: publicación Instagram confirmada $DAY" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Conservar diagnostico y recibo incluso si falla la verificacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-morning-publication-receipt
          path: |
            staged/published.json
            staged/prepared.json
            staged/instagram_cover.jpg
          if-no-files-found: ignore
      - name: Aviso visible de fallo
        if: failure()
        run: echo '::error::UMBRAL fallo. Revisar pasos y recibo; no repetir publicaciones inciertas.'
