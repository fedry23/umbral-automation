name: UMBRAL - Integration gate (no publication)
on:
  push:
    branches: ['integration/episode-learning']
    paths: ['.github/workflows/episode_integration_gate.yml']
  pull_request:
    branches: [main]
    paths:
      - 'scripts/episode_state.py'
      - 'scripts/technical_learning.py'
      - 'scripts/reconcile_publications.py'
      - 'tests/test_technical_learning_reconciliation.py'
      - 'tests/test_episode_learning_integration.py'
      - 'render.py'
      - 'scripts/publish_daily.py'
      - 'scripts/stage_*_reel.py'
      - '.github/workflows/episode_integration_gate.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: umbral-integration-gate-${{ github.sha }}
  cancel-in-progress: true
jobs:
  tests:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-render
        with:
          models: 'false'
      - run: python -m compileall -q render.py audio_engine.py scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Validate current official receipts
        run: python -c 'from scripts.episode_state import next_episode; print("Next number from verified official receipts:", next_episode())'
  private-render:
    needs: tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-render
        with:
          models: 'true'
      - name: Render without Meta credentials
        env:
          UMBRAL_DYNAMIC_EPISODES: '1'
          UMBRAL_REQUIRE_DATED_STORY: '1'
          UMBRAL_DATE: '2026-11-19'
          UMBRAL_SLOT: '09'
          UMBRAL_SPEED: '1.08'
        run: python -u render.py
      - name: Validate local media and staging contract
        run: |
          python - <<'PY'
          import io, json, subprocess, zipfile, tempfile
          from pathlib import Path
          from PIL import Image
          from scripts import stage_morning_reel as stage
          import os
          os.environ["UMBRAL_DYNAMIC_EPISODES"] = "1"
          source = Path("output")
          video = source / "umbral_20261119_09.mp4"
          voice = source / "voice.wav"
          music = source / "music.wav"
          for path in (video, voice, music, source / "subtitles.ass", source / "cover.jpg"):
              assert path.is_file() and path.stat().st_size > 100, str(path)
          assert "Dialogue:" in (source / "subtitles.ass").read_text()
          story = json.loads((source / 'story_used.json').read_text())
          assert story['technical_profile']['music_gain'] == 1.0
          assert story['episode_number'] > 0
          with Image.open(source / "cover.jpg") as image:
              assert image.size == (1080, 1920) and image.format == "JPEG"
          with Image.open(source / "scene_contact_sheet.jpg") as image:
              image.verify()
          for path in (video, voice, music):
              subprocess.run(["ffmpeg", "-v", "error", "-xerror", "-i", str(path), "-f", "null", "-"], check=True)
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer, "w") as archive:
              for name in (video.name, "story_used.json", "caption.txt", "music.wav",
                           "cover.jpg", "intro_card.png", "outro_card.png", "branding_timing.json"):
                  archive.write(source / name, name)
          with tempfile.TemporaryDirectory() as folder:
              stage.OUT = Path(folder)
              result = stage.extract_run_zip(buffer.getvalue(), "2026-11-19")
              print("Validated staging contract:", result["duration"])
          print("Voice/music decoded, subtitles exist, JPEG verified, MP4 decoded and staged.")
          PY
      # The repository is public: no video, images, voice or story artifacts
      # are uploaded. The test media exists only on the temporary runner.
      - name: Remove local test media
        if: always()
        run: rm -rf -- output
