          python - <<'PY'
          from pathlib import Path
          import os,hashlib
          folder=Path(os.environ["RUNNER_TEMP"])/"umbral3-numbered"
          frames=[folder/f"scene_{n:02}.png" for n in range(6)]
          assert all(p.is_file() for p in frames)
          assert len({hashlib.sha256(p.read_bytes()).hexdigest() for p in frames})==6
          print("UMBRAL3_LATE_NUMBER_PASS: 6 original images, new official-numbered preview; nothing published")
          PY
