name: UMBRAL 3 - private storage connectivity
on:
  push:
    branches: [integration/umbral-3]
    paths: ['ops/umbral3-storage-kick.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: umbral3-private-bucket
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'fedry23/umbral-automation' && github.ref == 'refs/heads/integration/umbral-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_VERBOSITY: error
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated storage SDK
        run: python -m pip install --disable-pip-version-check huggingface_hub==1.19.0
      - name: Verify private bucket and exact content read-back
        run: |
          set -euo pipefail
          export UMBRAL_HF_BUCKET="$(head -n 1 ops/umbral3-storage-kick.txt)"
          python -m scripts.umbral3_hf_probe
