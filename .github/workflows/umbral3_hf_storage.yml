  live-routing:
    # Owner-reviewed until 27 Nov; from 28 Nov check separate private SHA
    # machine QA certificate using a workflow-scoped OIDC token (no Meta).

    if: github.repository == 'fedry23/umbral-automation' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && (github.event.schedule == '17 5 * * *' || github.event.schedule == '17 6 * * *' || github.event.schedule == '17 17 * * *' || github.event.schedule == '17 18 * * *')
    runs-on: ubuntu-latest
