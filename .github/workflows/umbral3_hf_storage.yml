name: UMBRAL 3 - private storage connectivity
on:
  push:
    branches: [integration/umbral-3]
    paths: ['ops/umbral3-storage-kick.txt']
  workflow_dispatch:
    inputs:
      render_private:
        description: 'Explicitly render a full private trial Reel'
        type: boolean
        default: false
      audit_private:
        description: 'Audit existing private archive inventory without generating media'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: umbral3-private-bucket
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'fedry23/umbral-automation' && github.ref == 'refs/heads/integration/umbral-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      HF_HUB_VERBOSITY: error
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated storage SDK
        run: python -m pip install --disable-pip-version-check huggingface_hub==1.19.0 Pillow==11.3.0
      - name: Verify private bucket and exact content read-back
        run: |
          set -euo pipefail
          export UMBRAL_HF_BUCKET="$(head -n 1 ops/umbral3-storage-kick.txt)"
          python -m scripts.umbral3_hf_probe
      - name: Round-trip validated six-scene bundle with immutable metadata
        run: python -m scripts.umbral3_hf_roundtrip
      - name: Prove full v2 audiovisual archive contract using synthetic private files
        run: python -m scripts.umbral3_hf_full_archive_smoke
      - name: Verify persisted private archives after workflow restart
        if: (github.event_name == 'workflow_dispatch' && inputs.audit_private == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'UMBRAL private inventory'))
        run: python -m scripts.umbral3_hf_inventory

  render-fixture:
    needs: verify
    if: github.repository == 'fedry23/umbral-automation' && github.ref == 'refs/heads/integration/umbral-3' && ((github.event_name == 'workflow_dispatch' && inputs.render_private == true) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'UMBRAL private full render')))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fixture: [0, 1, 2]
    permissions:
      contents: read
      id-token: write
    env:
      UMBRAL_PRIVATE_STORE: hf_bucket
      UMBRAL_HF_STORAGE_PYTHON: /tmp/umbral3-hf-storage/bin/python
      UMBRAL_IMAGE_BACKEND: turbo
      UMBRAL_IMAGE_PROFILE: quality
      UMBRAL_IMAGE_ATTEMPTS: '3'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-render
        with:
          models: 'true'
      - name: Install private SDK in independent environment
        run: |
          python -m venv /tmp/umbral3-hf-storage
          /tmp/umbral3-hf-storage/bin/python -m pip install --disable-pip-version-check huggingface_hub==1.19.0
      - name: Render real private test Reel and verify remote full media readback
        run: python -u -m scripts.umbral3_private_render --index ${{ matrix.fixture }} --private-evidence
