        run: rm -rf -- "$RUNNER_TEMP/umbral3-d7-smoke"


  automatic-art-private-pilot:
    # Only the explicit owner-approved deployment commit, on MAIN, can write
    # machine evidence for the already generated 28-Nov private candidates.
    # No IG_ACCESS_TOKEN, GITHUB_TOKEN write, Pages or Meta permissions.
    if: github.repository == 'fedry23/umbral-automation' && github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'UMBRAL automatic visual QA private pilot')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
    env:
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-render
        with:
          models: 'true'
      - name: Install isolated OIDC private reader with image metrics
        run: |
          python -m venv /tmp/umbral3-hf-storage
          /tmp/umbral3-hf-storage/bin/python -m pip install --disable-pip-version-check 'huggingface_hub==1.19.0' 'Pillow==11.3.0' 'numpy==1.26.4'
      - name: CLIP-verify already stored future morning without Meta
        id: auto_morning
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export UMBRAL_CLIP_PYTHON="$(command -v python)"
          /tmp/umbral3-hf-storage/bin/python -u -m scripts.umbral3_machine_qa --mode certify --date 2026-11-28 --slot 09
      - name: CLIP-verify already stored future evening without Meta
        id: auto_evening
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export UMBRAL_CLIP_PYTHON="$(command -v python)"
          /tmp/umbral3-hf-storage/bin/python -u -m scripts.umbral3_machine_qa --mode certify --date 2026-11-28 --slot 21
      - name: Fail unless BOTH independently verified private certificates pass
        if: always()
        env:
          MORNING: ${{ steps.auto_morning.outcome }}
          EVENING: ${{ steps.auto_evening.outcome }}
        run: |
          test "$MORNING" = success && test "$EVENING" = success
          echo 'UMBRAL3_TWO_PRIVATE_AUTO_QA_CERTIFICATES=verified'

  daily-refill:
    if: github.repository == 'fedry23/umbral-automation' && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && vars.UMBRAL3_RESERVE_ENABLED != 'false' && github.event.schedule == '42 20 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slot: ['09', '21']
    permissions:
      contents: read
      id-token: write
    env:
      UMBRAL_HF_STORAGE_PYTHON: /tmp/umbral3-hf-storage/bin/python
      # Approved V3 direction for new private candidates; not permission to publish.
      UMBRAL_HORROR_DIRECTION: horror-v3
      HF_HOME: ${{ github.workspace }}/.cache/umbral3-lightning-model-cache
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm Git-tracked owner authorization for private D+7 refill
        env:
          UMBRAL3_RESERVE_OVERRIDE: ${{ vars.UMBRAL3_RESERVE_ENABLED }}
        run: python -m scripts.umbral3_rollout --mode refill
      - name: Authenticate the authorized main publisher; no Meta tokens
        run: |
          python -m venv /tmp/umbral3-hf-storage
          /tmp/umbral3-hf-storage/bin/python -m pip install --disable-pip-version-check 'huggingface_hub==1.19.0' 'Pillow==11.3.0'
      - name: Verify existing private candidate or select exactly one missing D+7 slot
        id: gate
        run: /tmp/umbral3-hf-storage/bin/python -u -m scripts.umbral3_refill_gate --recover-backlog --slot ${{ matrix.slot }}
      - name: Reuse pinned Lightning weights when a candidate is missing
        if: steps.gate.outputs.generate == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/umbral3-lightning-model-cache/hub
          key: umbral3-lightning-347b21e571d7b8a716af83f64d68c5c028c51c56-v1
      - uses: ./.github/actions/setup-render
        if: steps.gate.outputs.generate == 'true'
        with:
          models: 'true'
      - name: Install pinned 2-step SDXL Lightning CPU environment
        if: steps.gate.outputs.generate == 'true'
        run: |
          python -m venv /tmp/umbral3-lightning
          /tmp/umbral3-lightning/bin/python -m pip install --disable-pip-version-check 'Pillow==11.3.0' 'diffusers==0.37.1' 'transformers==4.57.6' 'huggingface-hub==0.35.1' 'optimum==2.3.0' 'optimum-intel==2.2.0' 'openvino==2026.4.0'
          /tmp/umbral3-lightning/bin/python -m pip check
      - name: Create six unapproved, hashed, dated cinematic storyboard shots
        if: steps.gate.outputs.generate == 'true'
        run: /tmp/umbral3-lightning/bin/python -u -m scripts.umbral3_lightning_scenes --anchor "${{ steps.gate.outputs.anchor }}" --index "${{ steps.gate.outputs.index }}" --output "$RUNNER_TEMP/umbral3-refill"
      - name: Assemble and privately persist one complete candidate, never publish
        if: steps.gate.outputs.generate == 'true'
        run: python -u -m scripts.umbral3_reserve_render --single --anchor "${{ steps.gate.outputs.anchor }}" --index "${{ steps.gate.outputs.index }}" --prepared-dir "$RUNNER_TEMP/umbral3-refill"
      - name: Verify the EXACT refilled date's private index and hashes
        if: steps.gate.outputs.generate == 'true'
        run: /tmp/umbral3-hf-storage/bin/python -u -m scripts.umbral3_refill_gate --index "${{ steps.gate.outputs.index }}" --anchor "${{ steps.gate.outputs.anchor }}"
      - name: Install automatic-QA image metrics into OIDC-only reader
        if: steps.gate.outputs.generate == 'true'
        run: /tmp/umbral3-hf-storage/bin/python -m pip install --disable-pip-version-check 'numpy==1.26.4'
      - name: Independently assess all six frames with pinned public CLIP
        if: steps.gate.outputs.generate == 'true'
        continue-on-error: true
        shell: bash
        env:
          UMBRAL3_AUTO_QA_ENABLED: ${{ vars.UMBRAL3_AUTO_QA_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${UMBRAL3_AUTO_QA_ENABLED:-}" = 'false' ]; then
            echo 'Automatic quality gate disabled; no certificate minted'
            exit 0
          fi
          export UMBRAL_CLIP_PYTHON="$(command -v python)"
          DAY="$(date -d "${{ steps.gate.outputs.anchor }}" +%F)"
          /tmp/umbral3-hf-storage/bin/python -u -m scripts.umbral3_machine_qa \
             --mode certify --date "$DAY" --slot "${{ matrix.slot }}"


