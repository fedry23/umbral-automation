name: UMBRAL - Generación para revisión

on:
  workflow_dispatch:
  # Respaldo externo si GitHub omite el cron nocturno. Solo este archivo activa el respaldo.
  push:
    branches: [main]
    paths:
      - 'ops/generate-kick.txt'
  # El workflow de generación NO publica en Instagram.
  schedule:
    - cron: '17 2 * * *' # Generar de madrugada, listo antes de las 21:00 Europe/Madrid
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: umbral-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-render
        with:
          models: "true"
      - name: Pruebas de sincronización y codificación
        run: python -m unittest discover -s tests -v
      - name: Crear Reel
        env:
          UMBRAL_SPEED: '1.08'
          UMBRAL_REQUIRE_DATED_STORY: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && '1' || '0' }}
        run: /usr/bin/time -v python -u render.py
      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: umbral-reel
          path: |
            output/*.mp4
            output/timings.json
            output/subtitles.ass
            output/scene_*.png
            output/voice.wav
            output/music.wav
            output/branding_timing.json
            output/brand_story.json
            output/intro_card.png
            output/outro_card.png
            output/cover.jpg
            output/caption.txt
            output/story_used.json
          retention-days: 7
          if-no-files-found: error
