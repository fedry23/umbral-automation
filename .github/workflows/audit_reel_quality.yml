name: UMBRAL - Auditoria de Reels y deteccion de duplicados
on:
  schedule:
    - cron: '15 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/quality-audit-kick.txt']
permissions:
  contents: write
concurrency:
  group: umbral-quality-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detectar incidencias sin modificar Instagram
        env:
          IG_DELETE_ACCESS_TOKEN: ${{ secrets.IG_DELETE_ACCESS_TOKEN }}
        run: python scripts/audit_reel_quality.py
      - name: Guardar informe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/reel-quality.json
          git commit -m "audit: UMBRAL Reel quality and duplicate scan" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
