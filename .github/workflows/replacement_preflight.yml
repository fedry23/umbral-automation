name: UMBRAL - Comprobar sustitución sin borrar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/replacement-preflight-kick.txt']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar objetivo y permisos sin eliminar ni publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/replacement_preflight.py
      - name: Conservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-replacement-preflight
          path: staged/replacement_preflight.json
          retention-days: 3
          if-no-files-found: ignore
