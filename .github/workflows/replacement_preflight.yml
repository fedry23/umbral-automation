name: UMBRAL - Comprobar sustitución sin borrar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ops/replacement-preflight-kick.txt']
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar objetivo y permisos sin eliminar ni publicar
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/replacement_preflight.py
      - name: Guardar resultado verificable en el repositorio
        if: success()
        shell: bash
        run: |
          mkdir -p docs/audit
          cp staged/replacement_preflight.json docs/audit/replacement-preflight.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/replacement-preflight.json
          if ! git diff --cached --quiet; then
            git commit -m "UMBRAL: registrar preflight seguro de sustitución"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Conservar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-replacement-preflight
          path: staged/replacement_preflight.json
          retention-days: 3
          if-no-files-found: ignore
