name: UMBRAL 4 isolated offline tests
on:
  push:
    branches: [integration/umbral-4]
    paths: ['umbral4/**', '.github/workflows/umbral4_ci.yml']
  pull_request:
    branches: [main]
    paths: ['umbral4/**', '.github/workflows/umbral4_ci.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check umbral4/publisher.mjs && node --check umbral4/adapters.mjs && node umbral4/publisher.test.mjs && node umbral4/integration.test.mjs
