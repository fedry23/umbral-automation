name: UMBRAL - Publicar unica prueba cinematografica 6

on:
  push:
    branches: [main]
    paths: ['ops/cinematic-publish.json']

permissions:
  contents: write
  actions: read
  pages: write

concurrency:
  group: umbral-instagram-21
  cancel-in-progress: false

jobs:
  publicar:
    # Publicación programada autorizada. La tarea antigua de ChatGPT está desactivada.
    # Bloqueo manual de emergencia: UMBRAL_META_PUBLISH_ENABLED=false en Variables.
    if: ${{ github.event_name == 'push' && vars.UMBRAL_META_PUBLISH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
      UMBRAL_DURABLE_GUARD: '1'
      UMBRAL_TEST_MODE: cinematic-episode-6
    steps:
      - name: Código y autorización
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow==11.3.0 numpy==1.26.4

      - name: Comprobar credenciales sin mostrarlas
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::error::Falta GitHub Actions Secret IG_ACCESS_TOKEN; publicación no habilitada"
            exit 1
          fi

      - name: Comprobar día, hora y duplicados
        id: guard
        shell: bash
        run: |
          DAY="$(TZ=Europe/Madrid date +%F)"
          HHMM="$(TZ=Europe/Madrid date +%H%M)"
          echo "date=$DAY" >> "$GITHUB_OUTPUT"
          if [ -f "docs/published/test-cinematic-episode-6.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "UMBRAL ya tiene recibo para $DAY, no duplicar"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Generación comprobable y publicación preparada antes de las 21:00"
          fi

      - name: Recuperar y verificar Reel generado de madrugada
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/stage_cinematic_test.py

      - name: Validar formato Meta y autocorregir audio si hace falta
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          DAY="${{ steps.guard.outputs.date }}"
          python scripts/ensure_meta_compatible.py "staged/umbral_${DAY//-/}.mp4"

      - name: Guardar la copia pública HTTPS de hoy
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          DAY="${{ steps.guard.outputs.date }}"
          if [ -f staged/already_published ]; then exit 0; fi
          mkdir -p docs/reels
          cp "staged/umbral_${DAY//-/}.mp4" "docs/reels/test-cinematic-episode-6.mp4"
          test -f staged/cover.jpg
          cp staged/cover.jpg "docs/reels/test-cinematic-episode-6.jpg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/reels/test-cinematic-episode-6.mp4" "docs/reels/test-cinematic-episode-6.jpg"
          if ! git diff --cached --quiet; then
            git commit -m "UMBRAL: preparar Reel original $DAY"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Solicitar explícitamente el despliegue de GitHub Pages
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          # Los pushes hechos por GITHUB_TOKEN no desencadenan Pages automáticamente.
          # API oficial: POST /repos/{owner}/{repo}/pages/builds (pages:write)
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          echo "Actualización de Pages solicitada para el vídeo del día"

      - name: Verificar que GitHub Pages sirve MP4 y portada JPEG exactos
        if: steps.guard.outputs.skip == 'false'
        env:
          UMBRAL_COVER_REQUIRED: '1'
          UMBRAL_VIDEO_FILE: docs/reels/test-cinematic-episode-6.mp4
          UMBRAL_VIDEO_URL: https://fedry23.github.io/umbral-automation/reels/test-cinematic-episode-6.mp4
          UMBRAL_COVER_FILE: docs/reels/test-cinematic-episode-6.jpg
          UMBRAL_COVER_URL: https://fedry23.github.io/umbral-automation/reels/test-cinematic-episode-6.jpg
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          python scripts/wait_public_video.py

      - name: Preparar el contenedor de Instagram con tiempo
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          test -s staged/public_cover_url.txt
          python scripts/publish_daily.py prepare \
            --date "${{ steps.guard.outputs.date }}" \
            --video-url "$(cat staged/public_video_url.txt)" \
            --cover-url "$(cat staged/public_cover_url.txt)"

      - name: Publicar unica prueba autorizada tras revision
        if: steps.guard.outputs.skip == 'false'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -f staged/already_published ]; then exit 0; fi
          python scripts/publish_daily.py publish --date "${{ steps.guard.outputs.date }}"

      - name: Registrar ID y fecha, evitando futuras publicaciones duplicadas
        if: always() && steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          DAY="${{ steps.guard.outputs.date }}"
          if [ ! -f staged/published.json ]; then exit 0; fi
          mkdir -p docs/published
          cp staged/published.json "docs/published/test-cinematic-episode-6.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/published/test-cinematic-episode-6.json"
          git commit -m "UMBRAL: publicación Instagram confirmada $DAY" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Conservar diagnostico y recibo incluso si falla la verificacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umbral-publication-receipt
          path: |
            staged/published.json
            staged/prepared.json
            staged/instagram_cover.jpg
          if-no-files-found: ignore
      - name: Aviso visible de fallo
        if: failure()
        run: echo '::error::UMBRAL fallo. Revisar pasos y recibo; no repetir publicaciones inciertas.'
