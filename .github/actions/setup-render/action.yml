name: UMBRAL Python runtime
description: Install cached dependencies and optional public CPU models
inputs:
  models:
    description: Install full rendering runtime
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-test.txt
    - name: Restore public model weights
      if: inputs.models == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: umbral-models-${{ runner.os }}-py311-${{ hashFiles('requirements.txt', 'requirements-test.txt') }}
    - name: System tools
      shell: bash
      run: |
        missing=()
        command -v ffmpeg >/dev/null 2>&1 || missing+=(ffmpeg)
        command -v ffprobe >/dev/null 2>&1 || missing+=(ffmpeg)
        command -v espeak-ng >/dev/null 2>&1 || missing+=(espeak-ng)
        test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || missing+=(fonts-dejavu-core)
        ldconfig -p | grep -q 'libsndfile.so.1 ' || missing+=(libsndfile1)
        if [ "${#missing[@]}" -gt 0 ]; then
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        else
          echo "System rendering tools already installed"
        fi
    - name: Python dependencies
      shell: bash
      env:
        WITH_MODELS: ${{ inputs.models }}
      run: |
        if [ "$WITH_MODELS" = 'true' ]; then
          python -m pip install -r requirements.txt
        else
          python -m pip install -r requirements-test.txt
        fi
