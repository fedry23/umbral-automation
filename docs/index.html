<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09080c">
  <meta name="description" content="UMBRAL: relatos originales de terror. Un nuevo miedo cada noche.">
  <title>UMBRAL · ¿Te atreves a entrar?</title>
  <style>
    :root{color-scheme:dark;--red:#e01b3c;--bg:#09080c;--fg:#f2f0ed;--dim:#b4aab4}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;background:radial-gradient(ellipse at 50% 46%,#3d0b1a 0%,#150b13 28%,var(--bg) 70%);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;overflow-x:hidden}
    main{padding:36px 22px 44px;max-width:560px;width:100%;text-align:center}
    .eyebrow{color:var(--dim);text-transform:uppercase;letter-spacing:.32em;font-size:.69rem;font-weight:700}
    .portal{height:210px;width:135px;margin:30px auto 25px;position:relative;border:8px solid #150d12;border-radius:75px 75px 3px 3px;box-shadow:0 0 0 2px #69222c,0 0 30px #e01b3c66,0 0 90px #dd082d22;transform:perspective(500px) rotateY(-7deg);background:linear-gradient(85deg,#24010c 15%,#7b001b 43%,#e12b41 51%,#21060d 70%)}
    .portal::before{content:'';position:absolute;inset:8px;border:2px solid #ff617066;border-radius:62px 62px 0 0;box-shadow:inset 0 0 42px #ff2335aa}
    .portal::after{content:'';position:absolute;top:61%;right:18px;width:8px;height:8px;background:#ffdebd;border-radius:50%;box-shadow:0 0 12px #fff}
    h1{margin:4px 0;font-size:clamp(3rem,13vw,5.1rem);letter-spacing:.1em;font-weight:900;text-shadow:0 4px 20px #f0022a40}
    .claim{color:#e1d9dc;font-size:clamp(1.1rem,4vw,1.35rem);line-height:1.55;margin:14px 0 20px}
    .sub{color:var(--dim);font-size:.92rem;line-height:1.55;margin:0 auto 25px;max-width:430px}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:50px;background:#ca1734;color:#fff;padding:12px 25px;text-decoration:none;border-radius:4px;font-weight:750;letter-spacing:.045em;box-shadow:0 9px 30px #c20d3763;transition:transform .15s,background .15s}
    .button:hover,.button:focus-visible{background:#ef2448;transform:translateY(-2px)}
    footer{margin-top:30px;color:#8d8189;font-size:.74rem;letter-spacing:.11em}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Lo que escuches aquí, se queda contigo</p>
    <div class="portal" aria-hidden="true"></div>
    <h1>UMBRAL</h1>
    <p class="claim">Te dijeron que no abrieras la puerta.<br>Has entrado igualmente.</p>
    <p class="sub">Relatos originales de terror. Un nuevo miedo cada noche a las <strong>21:00</strong> (hora peninsular). Ponte los auriculares y apaga la luz.</p>
    <a class="button" href="https://www.instagram.com/umbral.terror/" rel="noopener noreferrer">CRUZAR EL UMBRAL</a>
    <footer>ESTO ES SOLO EL PRINCIPIO.</footer>
  </main>
</body>
</html>
